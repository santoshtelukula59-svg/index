<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dice Roller</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
        background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTf-eKL2lE_Z6AyIQb17lD49RpbgB4RkjYKtaXU9i29Hg&s=10");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin-top: 0;
      color: #333;
    }

    .dice {
      width: 120px;
      height: 120px;
      margin: 30px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 70px;
      background: #fff;
      border: 4px solid #333;
      border-radius: 20px;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
    }

    .rolling {
      animation: roll 0.6s ease;
    }

    @keyframes roll {
      0% {
        transform: rotate(0deg) scale(1);
      }

      50% {
        transform: rotate(180deg) scale(1.2);
      }

      100% {
        transform: rotate(360deg) scale(1);
      }
    }

    button {
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: #667eea;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #5568d8;
      transform: translateY(-2px);
    }

    #result {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🎲 Dice Roller</h1>

    <div id="dice" class="dice">⚀</div>

    <button onclick="rollDice()">Roll Dice</button>

    <div id="result">Click the button to roll!</div>
  </div>

  <script>
    const diceFaces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

    function rollDice() {
      const dice = document.getElementById("dice");
      const result = document.getElementById("result");

      // Generate random number from 1 to 6
      const number = Math.floor(Math.random() * 6) + 1;

      // Restart animation
      dice.classList.remove("rolling");
      void dice.offsetWidth;
      dice.classList.add("rolling");

      // Change dice face
      dice.textContent = diceFaces[number - 1];

      // Show result
      result.textContent = `You rolled a ${number}!`;
    }
  </script>

</body>
</html>
