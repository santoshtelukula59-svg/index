<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Password Generator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .container {
      width: 400px;
      padding: 30px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    .password-box {
      display: flex;
      margin-bottom: 20px;
    }

    #password {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px 0 0 8px;
      font-size: 16px;
      outline: none;
    }

    .copy-btn {
      padding: 12px 15px;
      border: none;
      background: #667eea;
      color: white;
      cursor: pointer;
      border-radius: 0 8px 8px 0;
    }

    .copy-btn:hover {
      background: #5568d9;
    }

    .option {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 0;
      color: #444;
    }

    input[type="number"] {
      width: 70px;
      padding: 7px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .generate-btn {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate-btn:hover {
      background: #5568d9;
    }

    #message {
      text-align: center;
      margin-top: 12px;
      color: green;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Password Generator</h1>

    <div class="password-box">
      <input type="text" id="password" readonly placeholder="Your password">
      <button class="copy-btn" onclick="copyPassword()">Copy</button>
    </div>

    <div class="option">
      <label for="length">Password Length</label>
      <input type="number" id="length" min="4" max="50" value="12">
    </div>

    <div class="option">
      <label for="uppercase">Include Uppercase</label>
      <input type="checkbox" id="uppercase" checked>
    </div>

    <div class="option">
      <label for="lowercase">Include Lowercase</label>
      <input type="checkbox" id="lowercase" checked>
    </div>

    <div class="option">
      <label for="numbers">Include Numbers</label>
      <input type="checkbox" id="numbers" checked>
    </div>

    <div class="option">
      <label for="symbols">Include Symbols</label>
      <input type="checkbox" id="symbols" checked>
    </div>

    <button class="generate-btn" onclick="generatePassword()">
      Generate Password
    </button>

    <p id="message"></p>
  </div>

  <script>
    function generatePassword() {
      const length = parseInt(document.getElementById("length").value);

      const uppercase = document.getElementById("uppercase").checked;
      const lowercase = document.getElementById("lowercase").checked;
      const numbers = document.getElementById("numbers").checked;
      const symbols = document.getElementById("symbols").checked;

      const upperChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const lowerChars = "abcdefghijklmnopqrstuvwxyz";
      const numberChars = "0123456789";
      const symbolChars = "!@#$%^&*()_+{}[]<>?";

      let characters = "";

      if (uppercase) characters += upperChars;
      if (lowercase) characters += lowerChars;
      if (numbers) characters += numberChars;
      if (symbols) characters += symbolChars;

      if (characters.length === 0) {
        alert("Please select at least one character type.");
        return;
      }

      if (length < 4 || length > 50) {
        alert("Password length must be between 4 and 50.");
        return;
      }

      let password = "";

      for (let i = 0; i < length; i++) {
        const randomIndex = Math.floor(Math.random() * characters.length);
        password += characters[randomIndex];
      }

      document.getElementById("password").value = password;
      document.getElementById("message").textContent = "";
    }

    function copyPassword() {
      const password = document.getElementById("password").value;

      if (!password) {
        alert("Generate a password first.");
        return;
      }

      navigator.clipboard.writeText(password);

      document.getElementById("message").textContent =
        "Password copied to clipboard!";
    }

    // Generate a password when the page loads
    generatePassword();
  </script>

</body>
</html>
